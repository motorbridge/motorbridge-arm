[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motorbridge-arm"
version = "0.1.0"
description = "Product-form arm SDK built on motorbridge Python binding"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "motorbridge team"}]
dependencies = [
  "motorbridge>=0.2.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
  "websockets>=12.0",
]
kinematics = [
  "pin>=3.3.1",
  "numpy>=1.24",
]
full = [
  "pin>=3.3.1",
  "numpy>=1.24",
  "scipy>=1.10",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "motorbridge_arm_sdk"}

[tool.setuptools.packages.find]
where = ["motorbridge_arm_sdk"]

[tool.setuptools.package-data]
motorbridge_arm_sdk = ["assets/**/*"]

[tool.pytest.ini_options]
pythonpath = ["motorbridge_arm_sdk"]
testpaths = ["tests"]
